name: Build and test

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      # The project treats warnings as errors and runs the full Jellyfin analyzer set,
      # so a clean build here is a meaningful signal.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Verify the plugin assembly was produced
        run: test -f src/Jellyfin.Plugin.InterestCollections/bin/Release/net9.0/Jellyfin.Plugin.InterestCollections.dll
