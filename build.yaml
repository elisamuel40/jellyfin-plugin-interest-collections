overview: "Tag movies and shows with IMDb-style semantic Interests and build collections from them"
description: >
  Interest Collections classifies your movies and TV shows using granular semantic
  "Interests" (Psychological Thriller, Drug Crime, Dark Comedy, Serial Killer,
  Dystopian Sci-Fi, ...) instead of only coarse genres. Interests are written to
  Jellyfin Tags and can optionally be materialised as managed Collections, so a
  single title can appear in many interest-based collections at once.
